name: Sign Kernel

on:
  workflow_dispatch:
    inputs:
      signing_key:
        description: 'Ed25519 私钥（Base64，44 字符）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write signing key
        env:
          SIGNING_KEY: ${{ github.event.inputs.signing_key }}
        run: |
          # 关键：把私钥值加入日志屏蔽列表，防止后续误打印
          echo "::add-mask::$SIGNING_KEY"
          # 用 printf 而不是 echo，避免末尾换行污染 Base64
          printf '%s' "$SIGNING_KEY" > /tmp/private.key
          KEY_LEN=$(wc -c < /tmp/private.key)
          echo "Key written: $KEY_LEN bytes"
          if [ "$KEY_LEN" -ne 44 ]; then
            echo "::error::Key length should be 44 bytes, got $KEY_LEN"
            exit 1
          fi

      - name: Sign all kernel versions
        shell: bash
        run: |
          for dir in Tools/*/MV Tools/*/MZ; do
            if [ -d "$dir" ]; then
              echo "==> Signing: $dir"
              node sign.js "$dir" /tmp/private.key || true
            fi
          done

      - name: Cleanup key
        if: always()
        run: rm -f /tmp/private.key

      - name: Commit signed manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tools/**/manifest.json Tools/**/manifest.sig 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-sign kernel [skip ci]"
            git push
          fi

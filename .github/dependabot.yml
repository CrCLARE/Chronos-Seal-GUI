version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Electron 22.x 是最后一个支持 Windows 7 / 8 / 8.1 的版本
      # 升级会破坏目标用户群，此决策为架构性决定，非疏漏
      - dependency-name: "electron"
        update-types:
          - "version-update:semver-major"
    groups:
      npm_and_yarn:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
